<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Reader</title>
<style>
  /* --bg / --fg / --font are set from the 보기 설정 sheet; everything else is mixed from them. */
  :root { --size: 17px; --line: 29px; --bg: #141414; --fg: #9c9c9c; --font: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #bar { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; height: 32px; display: flex;
    align-items: center; justify-content: space-between; padding: 0 10px 0 22px; font-size: 12px;
    color: #555; color: color-mix(in srgb, var(--fg) 50%, var(--bg)); }
  #bar button { background: none; border: 0; color: inherit; font-size: 18px; padding: 4px 10px; }
  #page { position: fixed; top: calc(env(safe-area-inset-top) + 36px); bottom: calc(env(safe-area-inset-bottom) + 20px);
    left: 22px; right: 22px; overflow: hidden; touch-action: none; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; font-family: var(--font);
    font-size: var(--size); line-height: var(--line); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 8px; padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    background: #1d1d1d; background: color-mix(in srgb, var(--bg) 90%, var(--fg));
    border-top: 1px solid color-mix(in srgb, var(--bg) 80%, var(--fg)); }
  .sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet .three { grid-template-columns: repeat(3, 1fr); }
  .sheet .five { grid-template-columns: repeat(5, 1fr); }
  .sheet button, .sheet input { font: inherit; font-size: 15px; padding: 12px; border-radius: 8px; color: var(--fg); min-width: 0;
    border: 1px solid #333; border-color: color-mix(in srgb, var(--bg) 70%, var(--fg));
    background: #262626; background: color-mix(in srgb, var(--bg) 84%, var(--fg)); }
  .sheet input { user-select: text; -webkit-user-select: text; }
  .sheet input[type=color] { width: 100%; height: 44px; padding: 3px; }
  .sheet label { display: grid; gap: 4px; font-size: 13px; }
  .sheet p, .sheet label { margin: 2px; font-size: 13px; color: color-mix(in srgb, var(--fg) 70%, var(--bg)); word-break: break-all; }
  .sheet .on { outline: 2px solid var(--fg); outline-offset: 1px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bar"><span id="info"></span><button id="more" aria-label="메뉴">⋯</button></div>
<div id="page"><div id="text"></div></div>

<div id="menu" class="sheet" hidden>
  <p id="title"></p>
  <div class="row"><button data-act="mark">책갈피 저장</button><button data-act="jump">책갈피로 이동</button></div>
  <div class="row"><button data-act="look">보기 설정</button><button data-act="open">다른 TXT 열기</button></div>
  <button data-act="setup">동기화 설정</button>
</div>

<div id="look" class="sheet" hidden>
  <p>글씨체</p>
  <div class="row three">
    <button data-act="font" data-font="system">기본</button><button data-act="font" data-font="Nanum Gothic">나눔고딕</button>
    <button data-act="font" data-font="Gowun Dodum">고운돋움</button><button data-act="font" data-font="Nanum Myeongjo">나눔명조</button>
    <button data-act="font" data-font="Gowun Batang">고운바탕</button><button data-act="font" data-font="Noto Serif KR">본명조</button>
  </div>
  <p>테마</p>
  <div class="row five">
    <button data-act="theme" data-bg="#141414" data-fg="#9c9c9c" style="background:#141414;color:#9c9c9c">가</button>
    <button data-act="theme" data-bg="#000000" data-fg="#a8a8a8" style="background:#000000;color:#a8a8a8">가</button>
    <button data-act="theme" data-bg="#f3e9d2" data-fg="#5b4636" style="background:#f3e9d2;color:#5b4636">가</button>
    <button data-act="theme" data-bg="#c7e5c8" data-fg="#2d3b2e" style="background:#c7e5c8;color:#2d3b2e">가</button>
    <button data-act="theme" data-bg="#fafafa" data-fg="#222222" style="background:#fafafa;color:#222222">가</button>
  </div>
  <div class="row"><label>배경색<input id="bg" type="color"></label><label>글자색<input id="fg" type="color"></label></div>
  <div class="row"><button data-act="smaller">글자 작게</button><button data-act="bigger">글자 크게</button></div>
  <div class="row"><button data-act="tighter">줄 간격 좁게</button><button data-act="looser">줄 간격 넓게</button></div>
  <button data-act="close">닫기</button>
</div>

<div id="empty" class="sheet" hidden>
  <p>읽을 TXT 파일을 고르세요. 파일은 이 폰 브라우저에만 보관합니다.</p>
  <div class="row"><button data-act="open">TXT 열기</button><button data-act="setup">동기화 설정</button></div>
</div>

<form id="setup" class="sheet" hidden>
  <p>읽던 위치만 GitHub 비밀 Gist에 저장합니다. 토큰은 이 브라우저에만 남습니다. 둘 다 비우면 동기화를 끕니다.</p>
  <input id="token" type="password" placeholder="GitHub 토큰 (Gist 읽기·쓰기 권한)" autocomplete="off">
  <input id="gist" placeholder="Gist ID" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row"><button type="button" data-act="close">취소</button><button>저장</button></div>
  <p id="setupNote"></p>
</form>
<input id="file" type="file" accept=".txt,text/plain" hidden>

<script>
const API = 'https://api.github.com';
const PUSH_GAP = 20000; // GitHub limits how often content is written
const $ = id => document.getElementById(id);
const page = $('page'), textBox = $('text');
let book = null;      // { name, digest, text, astral, points }
let state = null;     // { offset, bookmark, updated }: offsets in characters, same as reader.py
let pos = 0, end = 0; // current page as UTF-16 indexes into book.text
let note = '';

// Must match read_text() in reader.py, or offsets and digests will not line up.
function decode(bytes) {
  const labels = bytes[0] === 0xff && bytes[1] === 0xfe ? ['utf-16le']
    : bytes[0] === 0xfe && bytes[1] === 0xff ? ['utf-16be'] : ['utf-8', 'euc-kr'];
  for (const label of labels) {
    let text;
    try { text = new TextDecoder(label, { fatal: true }).decode(bytes); } catch (e) { continue; }
    return text.replace(/\r\n?/g, '\n').replace(/[^\P{C}\n\t]/gu, '');
  }
  throw new Error('지원하지 않는 인코딩입니다. TXT를 UTF-8로 저장해 주세요.');
}

async function sha256(text) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// reader.py counts characters (code points); JS strings count UTF-16 units. Convert at the edges.
function astralOf(text) {
  const list = [];
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    if (c >= 0xd800 && c <= 0xdbff) list.push(i++);
  }
  return list;
}
function count(n, below) {
  let lo = 0, hi = n;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (below(mid)) lo = mid + 1; else hi = mid; }
  return lo;
}
const toPoint = unit => unit - count(book.astral.length, k => book.astral[k] < unit);
const toUnit = point => point + count(book.astral.length, k => book.astral[k] - k < point);

function db(mode, run) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('reader', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('kv', mode), req = run(tx.objectStore('kv'));
      tx.oncomplete = () => { open.result.close(); resolve(req.result); };
      tx.onerror = () => reject(tx.error);
    };
  });
}
const local = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
};

// ---- pages ----
function fits(from, to) {
  textBox.textContent = book.text.slice(from, to);
  return textBox.getBoundingClientRect().height <= page.clientHeight;
}
function pageEnd(start) {
  const text = book.text, len = text.length;
  let ok = start, bad = len + 1, step = 400;
  while (ok < len) {
    const next = Math.min(len, ok + step);
    if (!fits(start, next)) { bad = next; break; }
    ok = next; step *= 2;
  }
  while (bad - ok > 1) {
    const mid = (ok + bad) >> 1;
    if (fits(start, mid)) ok = mid; else bad = mid;
  }
  if (ok < len) {
    if (/[\ud800-\udbff]/.test(text[ok - 1])) ok--;
    const tail = text.slice(Math.max(start + 1, ok - 20), ok); // end on a word when one is near
    const space = Math.max(tail.lastIndexOf(' '), tail.lastIndexOf('\n'), tail.lastIndexOf('\t'));
    if (space >= 0) ok -= tail.length - space - 1;
  }
  return Math.max(ok, start + 1);
}
function pageStart(stop) {
  const text = book.text;
  let ok = stop, bad = -1, step = 400;
  while (ok > 0) {
    const next = Math.max(0, ok - step);
    if (!fits(next, stop)) { bad = next; break; }
    ok = next; step *= 2;
  }
  while (ok - bad > 1) {
    const mid = (ok + bad) >> 1;
    if (fits(mid, stop)) ok = mid; else bad = mid;
  }
  if (ok > 0 && /\S/.test(text[ok - 1])) {
    const space = text.slice(ok, Math.min(stop - 1, ok + 20)).search(/\s/);
    if (space >= 0) ok += space + 1;
  }
  if (/[\udc00-\udfff]/.test(text[ok])) ok++;
  return Math.min(ok, stop - 1);
}
function show(start) {
  const text = book.text;
  start = Math.max(0, Math.min(start, text.length));
  while (text[start] === '\n' && start < text.length - 1) start++;
  pos = start;
  end = pageEnd(pos);
  textBox.textContent = text.slice(pos, end);
  paintBar();
}
function paintBar() {
  const percent = book ? (toPoint(pos) / Math.max(1, book.points) * 100).toFixed(1) + '%' : '';
  $('info').textContent = [percent, note].filter(Boolean).join(' · ');
}
function setNote(text) { note = text; paintBar(); }

function record(change) {
  // Stay newer than an adopted record even if the other device's clock runs ahead.
  state = { ...state, ...change, updated: Math.max(Date.now(), state.updated + 1) };
  local.set('pos:' + book.digest, state);
  schedulePush();
}
function move(start) { show(start); record({ offset: toPoint(pos) }); }
function next() { if (end < book.text.length) move(end); }
function prev() { if (pos > 0) move(pageStart(pos)); }

// ---- sync (same Gist file as reader.py: <digest>.json) ----
function config() { return local.get('sync'); }
async function gist(method, body) {
  const { token, gist: id } = config();
  const res = await fetch(`${API}/gists/${id}`, {
    method, cache: 'no-store', body: body && JSON.stringify(body),
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
  });
  if (!res.ok) throw new Error('GitHub ' + res.status);
  return res.json();
}
function valid(saved) {
  const clamp = v => Math.max(0, Math.min(book.points, Math.floor(Number(v)) || 0));
  return { offset: clamp(saved.offset), bookmark: saved.bookmark == null ? null : clamp(saved.bookmark),
    updated: Number(saved.updated) || 0 };
}
async function pull() {
  if (!book || !config()) return;
  try {
    const file = (await gist('GET')).files[book.digest + '.json'];
    const remote = file && valid(JSON.parse(file.content));
    if (remote && remote.updated > state.updated) {
      state = remote;
      local.set('pos:' + book.digest, state);
      show(toUnit(state.offset));
    } else if ((remote ? remote.updated : -1) < state.updated) {
      schedulePush(true);
    }
    setNote('동기화됨');
  } catch (e) {
    setNote('동기화 실패');
  }
}
let pending = false, timer = 0, lastPush = 0, sending = Promise.resolve();
function schedulePush(now) {
  if (!config()) return;
  pending = true;
  clearTimeout(timer);
  timer = setTimeout(flush, now ? 0 : Math.max(0, lastPush + PUSH_GAP - Date.now()));
}
function flush() {
  clearTimeout(timer);
  if (!pending || !book || !config()) return sending;
  pending = false;
  lastPush = Date.now();
  const files = { [book.digest + '.json']: { content: JSON.stringify(state) } };
  return sending = sending.then(() => gist('PATCH', { files }))
    .then(() => setNote('동기화됨'), () => { pending = true; setNote('동기화 실패'); });
}

// ---- screens ----
async function load(saved) {
  const astral = astralOf(saved.text);
  book = { ...saved, astral, points: saved.text.length - astral.length };
  // updated -1 = never read on this phone, so any synced position wins.
  state = valid(local.get('pos:' + book.digest) || { offset: 0, bookmark: null, updated: -1 });
  show(toUnit(state.offset));
  await pull();
}
async function openBytes(name, bytes) {
  const text = decode(bytes);
  const saved = { name: name.replace(/\.txt$/i, ''), text, digest: await sha256(text) };
  await db('readwrite', s => s.put(saved, 'book'));
  flush();
  closeSheets();
  await load(saved);
}
const sheets = ['menu', 'setup', 'look'];
const sheetOpen = () => sheets.some(id => !$(id).hidden);
function closeSheets() { for (const id of [...sheets, 'empty']) $(id).hidden = id !== 'empty' || !!book; }
function openSheet(id) {
  closeSheets();
  $('empty').hidden = true;
  if (id === 'menu') {
    $('title').textContent = `${book.name} · 책갈피 ${state.bookmark == null ? '없음' : '있음'}`;
  } else if (id === 'setup') {
    const saved = config() || {};
    $('token').value = saved.token || '';
    $('gist').value = saved.gist || '';
    $('setupNote').textContent = '';
  }
  $(id).hidden = false;
}
// ---- look: font, colors, size, line spacing ----
const FONTS = {
  system: 'system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif',
  'Nanum Gothic': '"Nanum Gothic", sans-serif', 'Gowun Dodum': '"Gowun Dodum", sans-serif',
  'Nanum Myeongjo': '"Nanum Myeongjo", serif', 'Gowun Batang': '"Gowun Batang", serif', 'Noto Serif KR': '"Noto Serif KR", serif',
};
let look = { size: local.get('font') || 17, line: 1.7, font: 'system', bg: '#141414', fg: '#9c9c9c', ...local.get('look') };
function setLook(change) {
  look = { ...look, ...change };
  look.size = Math.max(13, Math.min(28, look.size));
  look.line = Math.max(1.3, Math.min(2.4, Math.round(look.line * 10) / 10));
  local.set('look', look);
  applyLook();
}
function applyLook() {
  const root = document.documentElement.style;
  root.setProperty('--size', look.size + 'px');
  root.setProperty('--line', Math.round(look.size * look.line) + 'px');
  root.setProperty('--bg', look.bg);
  root.setProperty('--fg', look.fg);
  root.setProperty('--font', FONTS[look.font] || FONTS.system);
  document.querySelector('meta[name=theme-color]').content = look.bg;
  const id = 'font-' + look.font.replace(/ /g, '-');
  if (look.font in FONTS && look.font !== 'system' && !$(id)) {
    document.head.append(Object.assign(document.createElement('link'), {
      id, rel: 'stylesheet', href: `https://fonts.googleapis.com/css2?family=${look.font.replace(/ /g, '+')}&display=swap`,
    }));
  }
  $('bg').value = look.bg;
  $('fg').value = look.fg;
  for (const b of document.querySelectorAll('[data-font]')) b.classList.toggle('on', b.dataset.font === look.font);
  for (const b of document.querySelectorAll('[data-bg]')) b.classList.toggle('on', b.dataset.bg === look.bg && b.dataset.fg === look.fg);
  if (book) show(pos);
}
// Web font pieces arrive after the page was measured; measure again so no line hides past the bottom.
document.fonts.addEventListener('loadingdone', () => book && show(pos));
$('bg').addEventListener('input', e => setLook({ bg: e.target.value }));
$('fg').addEventListener('input', e => setLook({ fg: e.target.value }));

const actions = {
  mark() { record({ bookmark: toPoint(pos) }); closeSheets(); setNote('책갈피 저장'); },
  jump() { if (state.bookmark != null) move(toUnit(state.bookmark)); closeSheets(); },
  look() { openSheet('look'); },
  font(b) { setLook({ font: b.dataset.font }); },
  theme(b) { setLook({ bg: b.dataset.bg, fg: b.dataset.fg }); },
  smaller() { setLook({ size: look.size - 1 }); },
  bigger() { setLook({ size: look.size + 1 }); },
  tighter() { setLook({ line: look.line - 0.1 }); },
  looser() { setLook({ line: look.line + 0.1 }); },
  open() { $('file').click(); },
  setup() { openSheet('setup'); },
  close() { closeSheets(); },
};
document.addEventListener('click', e => {
  const button = e.target.closest('[data-act]');
  if (button) actions[button.dataset.act](button);
});
$('more').addEventListener('click', () => book && ($('menu').hidden ? openSheet('menu') : closeSheets()));
// Tap = next page; swipe right = previous page, swipe left = next page.
let touch = null, swiped = 0;
page.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  touch = { clientX: t.clientX, clientY: t.clientY };
}, { passive: true });
page.addEventListener('touchend', e => {
  const start = touch, t = e.changedTouches[0];
  touch = null;
  if (!book || !start) return;
  const dx = t.clientX - start.clientX, dy = t.clientY - start.clientY;
  if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  swiped = Date.now();
  if (sheetOpen()) return closeSheets();
  if (dx > 0) prev(); else next();
});
page.addEventListener('click', () => {
  if (!book || Date.now() - swiped < 500) return;
  if (sheetOpen()) return closeSheets();
  next();
});
addEventListener('keydown', e => {
  if (!book || e.target.tagName === 'INPUT') return;
  if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
});
addEventListener('resize', () => book && show(pos));
document.addEventListener('visibilitychange', () => document.hidden ? flush() : pull());
addEventListener('pagehide', flush);

$('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try { await openBytes(file.name, new Uint8Array(await file.arrayBuffer())); } catch (err) { setNote(err.message); }
});
$('setup').addEventListener('submit', async e => {
  e.preventDefault();
  const token = $('token').value.trim(), id = $('gist').value.trim().replace(/\/+$/, '').split('/').pop();
  if (!token && !id) {
    localStorage.removeItem('sync');
    closeSheets();
    return setNote('동기화 꺼짐');
  }
  local.set('sync', { token, gist: id });
  $('setupNote').textContent = '확인 중…';
  try {
    await gist('GET');
    closeSheets();
    await pull();
  } catch (err) {
    $('setupNote').textContent = `연결 실패 (${err.message}). 토큰 권한과 Gist ID를 확인하세요.`;
  }
});

applyLook();
db('readonly', s => s.get('book'))
  .then(saved => saved ? load(saved) : closeSheets())
  .catch(() => closeSheets());
</script>
</body>
</html>
